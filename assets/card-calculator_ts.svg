<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" fill="none" role="img" aria-label="calculator_ts">
  <defs>
    <radialGradient id="g" cx="18%" cy="0%" r="80%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 700 23px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #eef1f6; }
      .tag   { font: 600 12px 'JetBrains Mono', monospace; fill: #34d399; }
      .desc  { font: 400 14px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #9aa3b5; }
      .chip  { font: 500 11px 'JetBrains Mono', monospace; fill: #8b93a7; text-anchor: middle; }
      .honest{ font: italic 400 12px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #7e8799; }
      .arrow { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #34d399; }
    </style>
  </defs>
  <rect x="1" y="1" width="458" height="248" rx="18" fill="#0d1017" stroke="#34d399" stroke-opacity="0.28"/>
  <rect x="1" y="1" width="458" height="248" rx="18" fill="url(#g)"/>
  <rect x="26" y="26" width="91" height="24" rx="12" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="72" y="42" class="tag" text-anchor="middle">spec-driven</text>
  <text x="430" y="44" class="arrow" text-anchor="end">→<animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></text>
  <text x="26" y="74" class="title">calculator_ts</text>
  <text x="26" y="96" class="desc">A small calculator whose logic is written</text><text x="26" y="118" class="desc">test-first against a written spec.</text>
  <g><rect x="26" y="170" width="81" height="22" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.12"/><text x="66" y="185" class="chip">TypeScript</text></g><g><rect x="115" y="170" width="39" height="22" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.12"/><text x="134" y="185" class="chip">Jest</text></g>
  <line x1="26" y1="210" x2="434" y2="210" stroke="#34d399" stroke-opacity="0.18"/>
  <text x="26" y="230" class="honest">12 passing unit tests.</text>
</svg>
