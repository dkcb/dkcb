<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" fill="none" role="img" aria-label="FLUX">
  <defs>
    <radialGradient id="g" cx="18%" cy="0%" r="80%">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 700 23px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #eef1f6; }
      .tag   { font: 600 12px 'JetBrains Mono', monospace; fill: #6ee7b7; }
      .desc  { font: 400 14px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #9aa3b5; }
      .chip  { font: 500 11px 'JetBrains Mono', monospace; fill: #8b93a7; text-anchor: middle; }
      .honest{ font: italic 400 12px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #7e8799; }
      .arrow { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #6ee7b7; }
    </style>
  </defs>
  <rect x="1" y="1" width="458" height="248" rx="18" fill="#0d1017" stroke="#6ee7b7" stroke-opacity="0.28"/>
  <rect x="1" y="1" width="458" height="248" rx="18" fill="url(#g)"/>
  <rect x="26" y="26" width="127" height="24" rx="12" fill="#6ee7b7" fill-opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.35"/>
  <text x="90" y="42" class="tag" text-anchor="middle">agentic commerce</text>
  <text x="430" y="44" class="arrow" text-anchor="end">→<animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></text>
  <text x="26" y="74" class="title">FLUX</text>
  <text x="26" y="96" class="desc">Payments gateway where AI agents hold</text><text x="26" y="118" class="desc">wallets and pay under human-set rules —</text><text x="26" y="140" class="desc">built by a team in a 3-day megathon.</text>
  <g><rect x="26" y="170" width="46" height="22" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.12"/><text x="49" y="185" class="chip">React</text></g><g><rect x="80" y="170" width="81" height="22" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.12"/><text x="120" y="185" class="chip">TypeScript</text></g><g><rect x="169" y="170" width="39" height="22" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.12"/><text x="188" y="185" class="chip">Vite</text></g>
  <line x1="26" y1="210" x2="434" y2="210" stroke="#6ee7b7" stroke-opacity="0.18"/>
  <text x="26" y="230" class="honest">My part: the front-end (~12k LOC) · backend by teammates.</text>
</svg>
