<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Dan K — systems for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <style>
      .name { font: 800 76px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #f3f5f9; letter-spacing: -2px; }
      .grad { font: 700 30px 'JetBrains Mono', 'Courier New', monospace; fill: url(#accent); letter-spacing: -0.5px; }
      .mono { font: 500 16px 'JetBrains Mono', 'Courier New', monospace; fill: #8b93a7; }
      .dot  { font: 500 16px 'JetBrains Mono', 'Courier New', monospace; fill: #6ee7b7; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- agent spend graph (right side) -->
  <g stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="820" y1="80"  x2="960" y2="150"><animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="960" y1="150" x2="1080" y2="90"><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/></line>
    <line x1="960" y1="150" x2="1040" y2="230"><animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="960" y1="150" x2="860" y2="220"><animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/></line>
    <line x1="1080" y1="90" x2="1130" y2="170"><animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="5.5s" repeatCount="indefinite"/></line>
  </g>
  <g>
    <circle cx="960" cy="150" r="7" fill="#6ee7b7">
      <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="80" r="4" fill="#60a5fa"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="4" fill="#60a5fa"><animate attributeName="fill-opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="230" r="4" fill="#f0abfc"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="220" r="3.5" fill="#60a5fa"><animate attributeName="fill-opacity" values="1;0.3;1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="170" r="3.5" fill="#6ee7b7"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text x="70" y="135" class="name">Dan K</text>
  <text x="72" y="185" class="grad">
    <tspan class="dot">I build </tspan>systems for AI agents
    <tspan class="dot">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- animated accent underline -->
  <rect x="72" y="200" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;430" dur="1.1s" begin="0.2s" fill="freeze"/>
  </rect>

  <text x="72" y="245" class="mono">C  →  C++  →  TypeScript  →  Python</text>
  <text x="72" y="272" class="mono">Software-engineering student · Codam (42) · Amsterdam</text>
</svg>
