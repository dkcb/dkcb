<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Dan K — systems for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <style>
      .name { font: 800 76px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #f3f5f9; letter-spacing: -2px; }
      .grad { font: 700 30px 'JetBrains Mono', 'Courier New', monospace; fill: url(#accent); letter-spacing: -0.5px; }
      .mono { font: 500 16px 'JetBrains Mono', 'Courier New', monospace; fill: #8b93a7; }
      .dot  { font: 500 16px 'JetBrains Mono', 'Courier New', monospace; fill: #6ee7b7; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- agent spend graph (right side): a hub node (the Octocat), drifting
       satellites, and value "flowing" along the edges toward the hub. Edges
       and packets stop at the hub's outer rim (radius 30 around 960,150) and
       are drawn beneath the Octocat so they collide with its edge, not its
       centre. -->
  <g stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4 8">
    <line x1="820" y1="80"  x2="933.2" y2="136.6" stroke-opacity="0.3"><animate attributeName="stroke-dashoffset" values="24;0" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="1080" y1="90" x2="986.8" y2="136.6" stroke-opacity="0.3"><animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="230" x2="981.2" y2="171.2" stroke-opacity="0.3"><animate attributeName="stroke-dashoffset" values="24;0" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="860" y1="220" x2="935.4" y2="167.2" stroke-opacity="0.3"><animate attributeName="stroke-dashoffset" values="24;0" dur="3.3s" repeatCount="indefinite"/></line>
    <line x1="1130" y1="170" x2="1080" y2="90" stroke-opacity="0.22"><animate attributeName="stroke-dashoffset" values="24;0" dur="3.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- satellites -->
  <g>
    <circle cx="820" cy="80" r="4" fill="#60a5fa"><animate attributeName="cy" values="80;72;80" dur="6s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="4" fill="#60a5fa"><animate attributeName="cx" values="1080;1090;1080" dur="7s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="230" r="4" fill="#f0abfc"><animate attributeName="cy" values="230;222;230" dur="6.5s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="220" r="3.5" fill="#60a5fa"><animate attributeName="cx" values="860;852;860" dur="7.5s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="1;0.3;1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="170" r="3.5" fill="#6ee7b7"><animate attributeName="cy" values="170;162;170" dur="6.8s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- flowing value packets (stop at the hub rim, beneath the Octocat) -->
  <g>
    <circle r="2.6" fill="#6ee7b7"><animateMotion path="M820,80 L933.2,136.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="2.6" fill="#f0abfc"><animateMotion path="M1040,230 L981.2,171.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle r="2.6" fill="#60a5fa"><animateMotion path="M1080,90 L986.8,136.6" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Octocat hub (drawn last, on top of the edges and packets) -->
  <g>
    <circle cx="960" cy="150" r="30" fill="none" stroke="#6ee7b7" stroke-opacity="0.4">
      <animate attributeName="r" values="30;52" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="30" fill="#6ee7b7" fill-opacity="0.08"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="4.5s" repeatCount="indefinite"/>
      <g transform="translate(936,126) scale(3)">
        <path fill="url(#accent)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="70" y="135" class="name">Dan</text>
  <text x="72" y="185" class="grad">
    <tspan class="dot">Projects from low-level to AI agents infrastructure </tspan>
    <tspan class="dot">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- animated accent underline -->
  <rect x="72" y="200" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;430" dur="1.1s" begin="0.2s" fill="freeze"/>
  </rect>

  <text x="72" y="245" class="mono">C  →  C++  →  TypeScript  →  Python</text>
  <text x="72" y="272" class="mono">Software-engineering student · Codam (42) · Amsterdam</text>
</svg>
