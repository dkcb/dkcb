<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Dan K — systems for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <style>
      .name { font: 800 76px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #f3f5f9; letter-spacing: -2px; }
      .grad { font: 700 30px 'JetBrains Mono', 'Courier New', monospace; fill: url(#accent); letter-spacing: -0.5px; }
      .mono { font: 500 16px 'JetBrains Mono', 'Courier New', monospace; fill: #8b93a7; }
      .dot  { font: 500 16px 'JetBrains Mono', 'Courier New', monospace; fill: #6ee7b7; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Distribution graph (right side). The Octocat hub at (960,150) is a
       non-stop distributor: a narrow line flickers on like a fluorescent
       lamp warming up along a random path, a value packet travels in to the
       hub (or out from it), then the line goes dark while another channel
       lights up elsewhere. Each channel runs on its own non-harmonic period
       so the overall pattern never visibly repeats. -->

  <!-- faint endpoint nodes -->
  <g fill="#8b93a7" fill-opacity="0.35">
    <circle cx="790" cy="70"  r="2.5"/>
    <circle cx="1140" cy="95" r="2.5"/>
    <circle cx="1080" cy="235" r="2.5"/>
    <circle cx="840" cy="238" r="2.5"/>
    <circle cx="1165" cy="175" r="2.5"/>
    <circle cx="772" cy="150" r="2.5"/>
    <circle cx="1010" cy="48" r="2.5"/>
    <circle cx="918" cy="252" r="2.5"/>
  </g>

  <!-- channel 1: in, green, 3.7s -->
  <g>
    <line x1="960" y1="150" x2="790" y2="70" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="3.7s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="790" y2="70" stroke="#6ee7b7" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="3.7s" begin="0s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#6ee7b7" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="3.7s" begin="0s" repeatCount="indefinite"/>
      <animateMotion path="M790,70 L960,150" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="3.7s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 2: out, blue, 4.9s -->
  <g>
    <line x1="960" y1="150" x2="1140" y2="95" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.9s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="1140" y2="95" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.9s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#60a5fa" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="4.9s" begin="-1.6s" repeatCount="indefinite"/>
      <animateMotion path="M960,150 L1140,95" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="4.9s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 3: in, magenta, 4.1s -->
  <g>
    <line x1="960" y1="150" x2="1080" y2="235" stroke="#f0abfc" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.1s" begin="-2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="1080" y2="235" stroke="#f0abfc" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.1s" begin="-2.4s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#f0abfc" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="4.1s" begin="-2.4s" repeatCount="indefinite"/>
      <animateMotion path="M1080,235 L960,150" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="4.1s" begin="-2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 4: out, blue, 5.3s -->
  <g>
    <line x1="960" y1="150" x2="840" y2="238" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="5.3s" begin="-0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="840" y2="238" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="5.3s" begin="-0.9s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#60a5fa" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="5.3s" begin="-0.9s" repeatCount="indefinite"/>
      <animateMotion path="M960,150 L840,238" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="5.3s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 5: in, green, 3.3s -->
  <g>
    <line x1="960" y1="150" x2="1165" y2="175" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="3.3s" begin="-2.0s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="1165" y2="175" stroke="#6ee7b7" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="3.3s" begin="-2.0s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#6ee7b7" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="3.3s" begin="-2.0s" repeatCount="indefinite"/>
      <animateMotion path="M1165,175 L960,150" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="3.3s" begin="-2.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 6: out, magenta, 4.5s -->
  <g>
    <line x1="960" y1="150" x2="772" y2="150" stroke="#f0abfc" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.5s" begin="-3.1s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="772" y2="150" stroke="#f0abfc" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.5s" begin="-3.1s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#f0abfc" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="4.5s" begin="-3.1s" repeatCount="indefinite"/>
      <animateMotion path="M960,150 L772,150" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="4.5s" begin="-3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 7: in, blue, 5.9s -->
  <g>
    <line x1="960" y1="150" x2="1010" y2="48" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="5.9s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="1010" y2="48" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="5.9s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#60a5fa" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="5.9s" begin="-1.1s" repeatCount="indefinite"/>
      <animateMotion path="M1010,48 L960,150" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="5.9s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- channel 8: out, green, 4.3s -->
  <g>
    <line x1="960" y1="150" x2="918" y2="252" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.08;0;0.14;0.04;0.2;0.2;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.3s" begin="-3.6s" repeatCount="indefinite"/>
    </line>
    <line x1="960" y1="150" x2="918" y2="252" stroke="#6ee7b7" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0">
      <animate attributeName="stroke-opacity" values="0;0.6;0;0.95;0.2;1;1;0;0" keyTimes="0;0.04;0.07;0.1;0.13;0.18;0.55;0.62;1" dur="4.3s" begin="-3.6s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#6ee7b7" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.55;0.6;1" dur="4.3s" begin="-3.6s" repeatCount="indefinite"/>
      <animateMotion path="M960,150 L918,252" keyPoints="0;0;1;1" keyTimes="0;0.18;0.55;1" calcMode="linear" dur="4.3s" begin="-3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Octocat hub -->
  <g>
    <circle cx="960" cy="150" r="30" fill="none" stroke="#6ee7b7" stroke-opacity="0.4">
      <animate attributeName="r" values="30;52" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="30" fill="#6ee7b7" fill-opacity="0.08"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="4.5s" repeatCount="indefinite"/>
      <g transform="translate(936,126) scale(3)">
        <path fill="url(#accent)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="70" y="135" class="name">Dan K</text>
  <text x="72" y="185" class="grad">
    <tspan class="dot">I build </tspan>systems for AI agents
    <tspan class="dot">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- animated accent underline -->
  <rect x="72" y="200" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;430" dur="1.1s" begin="0.2s" fill="freeze"/>
  </rect>

  <text x="72" y="245" class="mono">C  →  C++  →  TypeScript  →  Python</text>
  <text x="72" y="272" class="mono">Software-engineering student · Codam (42) · Amsterdam</text>
</svg>
